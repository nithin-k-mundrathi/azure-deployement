# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - mentalhealth-prediction-streamlit-test

on:
  push:
    branches:
      - Main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://nithincontainerregistry.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_e24e571d7b984badbf4ff9424632a6c7 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_c62c3fee93524e3c940fc4448936d946 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: nithincontainerregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_e24e571d7b984badbf4ff9424632a6c7 }}/latest:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'mentalhealth-prediction-streamlit-test'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_2aac9383733046f2b96e666102809251 }}
        images: 'nithincontainerregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_e24e571d7b984badbf4ff9424632a6c7 }}/latest:${{ github.sha }}'